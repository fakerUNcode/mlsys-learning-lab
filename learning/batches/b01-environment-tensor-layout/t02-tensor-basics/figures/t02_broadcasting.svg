<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
<title id="title">广播把单列和单行逐元素相加</title><desc id="desc">shape 三乘一的列向量与 shape 一乘四的行向量逐元素广播，得到 shape 三乘四矩阵。</desc>
<rect width="980" height="360" rx="18" fill="#f7fafc"/>
<text x="36" y="48" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">广播：从右对齐维度，长度为 1 的轴可重复使用</text>
<g font-family="sans-serif" text-anchor="middle">
 <text x="135" y="98" font-size="18" fill="#315a7d">A shape (3,1)</text>
 <rect x="77" y="115" width="116" height="55" rx="8" fill="#dbeaf5" stroke="#7192ad"/><text x="135" y="150" font-size="21" fill="#18324b">10</text>
 <rect x="77" y="174" width="116" height="55" rx="8" fill="#dbeaf5" stroke="#7192ad"/><text x="135" y="209" font-size="21" fill="#18324b">20</text>
 <rect x="77" y="233" width="116" height="55" rx="8" fill="#dbeaf5" stroke="#7192ad"/><text x="135" y="268" font-size="21" fill="#18324b">30</text>
 <text x="346" y="98" font-size="18" fill="#315a7d">B shape (1,4)</text>
 <rect x="237" y="115" width="54" height="55" rx="8" fill="#e9e2f5" stroke="#9582b4"/><text x="264" y="150" font-size="19" fill="#342553">1</text>
 <rect x="293" y="115" width="54" height="55" rx="8" fill="#e9e2f5" stroke="#9582b4"/><text x="320" y="150" font-size="19" fill="#342553">2</text>
 <rect x="349" y="115" width="54" height="55" rx="8" fill="#e9e2f5" stroke="#9582b4"/><text x="376" y="150" font-size="19" fill="#342553">3</text>
 <rect x="405" y="115" width="54" height="55" rx="8" fill="#e9e2f5" stroke="#9582b4"/><text x="432" y="150" font-size="19" fill="#342553">4</text>
</g>
<text x="494" y="203" font-family="sans-serif" font-size="34" fill="#526678">+</text>
<path d="M528 200H575" stroke="#315a7d" stroke-width="3"/><path d="M563 190L577 200L563 210" fill="none" stroke="#315a7d" stroke-width="3"/>
<text x="605" y="98" font-family="sans-serif" font-size="18" fill="#315a7d">输出 shape (3,4)</text>
<g font-family="sans-serif" text-anchor="middle" font-size="18">
 <g fill="#fff" stroke="#93a9bb"><rect x="590" y="115" width="78" height="55"/><rect x="670" y="115" width="78" height="55"/><rect x="750" y="115" width="78" height="55"/><rect x="830" y="115" width="78" height="55"/></g><g fill="#334e68"><text x="629" y="149">11</text><text x="709" y="149">12</text><text x="789" y="149">13</text><text x="869" y="149">14</text></g>
 <g fill="#fff" stroke="#93a9bb"><rect x="590" y="174" width="78" height="55"/><rect x="670" y="174" width="78" height="55"/><rect x="750" y="174" width="78" height="55"/><rect x="830" y="174" width="78" height="55"/></g><g fill="#334e68"><text x="629" y="208">21</text><text x="709" y="208">22</text><text x="789" y="208">23</text><text x="869" y="208">24</text></g>
 <g fill="#fff" stroke="#93a9bb"><rect x="590" y="233" width="78" height="55"/><rect x="670" y="233" width="78" height="55"/><rect x="750" y="233" width="78" height="55"/><rect x="830" y="233" width="78" height="55"/></g><g fill="#334e68"><text x="629" y="267">31</text><text x="709" y="267">32</text><text x="789" y="267">33</text><text x="869" y="267">34</text></g>
</g>
<text x="73" y="326" font-family="sans-serif" font-size="16" fill="#526678">A 的每个行值重复到 4 列；B 的每个列值重复到 3 行。</text>
</svg>
