<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="470" viewBox="0 0 1220 470" role="img" aria-labelledby="title desc">
<title id="title">transpose 和 view 可以有相同 shape 但不同数值布局</title>
<desc id="desc">源 Tensor x 的 shape 是二乘三，值零到五，槽位也为零到五。transpose 得到 shape 三乘二、stride 一三，逻辑值为零三、一四、二五；view 得到 shape 三乘二、stride 二一，逻辑值为零一、二三、四五。两个结果都引用源 storage，但每个逻辑坐标映射到不同槽位。</desc>
<rect width="1220" height="470" rx="18" fill="#f7fafc"/>
<text x="36" y="43" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">同样的 shape (3,2)，两种操作重新解释坐标的方式不同</text>
<g font-family="sans-serif" text-anchor="middle">
 <text x="190" y="91" font-size="20" font-weight="700" fill="#315a7d">源 Tensor x</text>
 <text x="190" y="119" font-size="16" fill="#526678">shape (2,3)　stride (3,1)</text>
 <g font-size="17" fill="#18324b" text-anchor="middle">
  <rect x="75" y="145" width="76" height="58" fill="#e8f1f8" stroke="#7192ad"/><text x="113" y="171">0</text><text x="113" y="192" font-size="13">槽位 0</text>
  <rect x="153" y="145" width="76" height="58" fill="#e8f1f8" stroke="#7192ad"/><text x="191" y="171">1</text><text x="191" y="192" font-size="13">槽位 1</text>
  <rect x="231" y="145" width="76" height="58" fill="#e8f1f8" stroke="#7192ad"/><text x="269" y="171">2</text><text x="269" y="192" font-size="13">槽位 2</text>
  <rect x="75" y="205" width="76" height="58" fill="#e8f1f8" stroke="#7192ad"/><text x="113" y="231">3</text><text x="113" y="252" font-size="13">槽位 3</text>
  <rect x="153" y="205" width="76" height="58" fill="#e8f1f8" stroke="#7192ad"/><text x="191" y="231">4</text><text x="191" y="252" font-size="13">槽位 4</text>
  <rect x="231" y="205" width="76" height="58" fill="#e8f1f8" stroke="#7192ad"/><text x="269" y="231">5</text><text x="269" y="252" font-size="13">槽位 5</text>
 </g>
 <text x="190" y="306" font-size="15" fill="#526678">原 storage 只有这一份，两个结果都引用它</text>
 <path d="M350 196H420M420 196V140H465M420 196V320H465" fill="none" stroke="#315a7d" stroke-width="3"/><path d="M452 130L466 140L452 150M452 310L466 320L452 330" fill="none" stroke="#315a7d" stroke-width="3"/>
 <text x="720" y="88" font-size="19" font-weight="700" fill="#8a5a00">transpose(0,1)：交换行列坐标</text>
 <text x="720" y="115" font-size="15" fill="#735721">shape (3,2)　stride (1,3)</text>
 <g font-size="16" fill="#5d3b00">
  <rect x="520" y="132" width="88" height="51" fill="#fff3d9" stroke="#d39024"/><text x="564" y="155">值 0</text><text x="564" y="175" font-size="13">槽位 0</text>
  <rect x="610" y="132" width="88" height="51" fill="#fff3d9" stroke="#d39024"/><text x="654" y="155">值 3</text><text x="654" y="175" font-size="13">槽位 3</text>
  <rect x="520" y="185" width="88" height="51" fill="#fff3d9" stroke="#d39024"/><text x="564" y="208">值 1</text><text x="564" y="228" font-size="13">槽位 1</text>
  <rect x="610" y="185" width="88" height="51" fill="#fff3d9" stroke="#d39024"/><text x="654" y="208">值 4</text><text x="654" y="228" font-size="13">槽位 4</text>
  <rect x="520" y="238" width="88" height="51" fill="#fff3d9" stroke="#d39024"/><text x="564" y="261">值 2</text><text x="564" y="281" font-size="13">槽位 2</text>
  <rect x="610" y="238" width="88" height="51" fill="#fff3d9" stroke="#d39024"/><text x="654" y="261">值 5</text><text x="654" y="281" font-size="13">槽位 5</text>
 </g>
 <text x="610" y="313" font-size="15" fill="#735721">按行读：0, 3, 1, 4, 2, 5</text>
 <text x="976" y="88" font-size="19" font-weight="700" fill="#245c35">view(3,2)：每两个数分一行</text>
 <text x="976" y="115" font-size="15" fill="#426c49">shape (3,2)　stride (2,1)</text>
 <g font-size="16" fill="#20452a">
  <rect x="870" y="132" width="88" height="51" fill="#e8f3e9" stroke="#79a581"/><text x="914" y="155">值 0</text><text x="914" y="175" font-size="13">槽位 0</text>
  <rect x="960" y="132" width="88" height="51" fill="#e8f3e9" stroke="#79a581"/><text x="1004" y="155">值 1</text><text x="1004" y="175" font-size="13">槽位 1</text>
  <rect x="870" y="185" width="88" height="51" fill="#e8f3e9" stroke="#79a581"/><text x="914" y="208">值 2</text><text x="914" y="228" font-size="13">槽位 2</text>
  <rect x="960" y="185" width="88" height="51" fill="#e8f3e9" stroke="#79a581"/><text x="1004" y="208">值 3</text><text x="1004" y="228" font-size="13">槽位 3</text>
  <rect x="870" y="238" width="88" height="51" fill="#e8f3e9" stroke="#79a581"/><text x="914" y="261">值 4</text><text x="914" y="281" font-size="13">槽位 4</text>
  <rect x="960" y="238" width="88" height="51" fill="#e8f3e9" stroke="#79a581"/><text x="1004" y="261">值 5</text><text x="1004" y="281" font-size="13">槽位 5</text>
 </g>
 <text x="960" y="313" font-size="15" fill="#426c49">按行读：0, 1, 2, 3, 4, 5</text>
</g>
<rect x="49" y="365" width="1122" height="64" rx="12" fill="#eef2f5"/>
<text x="610" y="391" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#334e68">图中每格写“值”和它在原 storage 中的槽位编号。</text>
<text x="610" y="416" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#425466">transpose 让原列变成新行；view 保持原来的逻辑读数次序，只重新分组。两者都共享 x 的 storage。</text>
</svg>
